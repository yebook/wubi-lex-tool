[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
lzma-rs = "=0.3.0"
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls", "proxy-from-env"] }
url = "=2.5.7"
wubilex-app = { path = "../src-tauri", version = "=0.1.0" }
wubilex-codec = { path = "../crates/wubilex-codec", version = "=0.1.0" }
