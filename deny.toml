[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is a compile-time dependency of specta 2.0.0-rc.25; no safe upgrade exists, so review when the pinned Specta stack changes" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 is an unmaintained transitive dependency of tauri-utils via urlpattern; no safe upgrade exists, so review with Tauri upgrades" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 is an unmaintained transitive dependency of tauri-utils via urlpattern; no safe upgrade exists, so review with Tauri upgrades" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 is an unmaintained transitive dependency of tauri-utils via urlpattern; no safe upgrade exists, so review with Tauri upgrades" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 is an unmaintained transitive dependency of tauri-utils via urlpattern; no safe upgrade exists, so review with Tauri upgrades" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 is an unmaintained transitive dependency of tauri-utils via urlpattern; no safe upgrade exists, so review with Tauri upgrades" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
